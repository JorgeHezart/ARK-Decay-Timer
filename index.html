<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aisin Studio — Dossier v24</title>
<meta name="theme-color" content="#050506" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Aisin" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#050506;
    --panel:#09090b;
    --text:#f2f2f3;
    --muted:#85858e;
    --line:rgba(255,255,255,.10);
    --red:#e11d2e;
    --red2:#ff293d;
    --display:'Anton',sans-serif;
    --ui:'Rajdhani',sans-serif;
    --mono:'JetBrains Mono',monospace;
    --cols:8;
  }

  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{
    margin:0;
    min-height:100vh;
    color:var(--text);
    font-family:var(--ui);
    font-weight:600;
    background:
      repeating-linear-gradient(-55deg,rgba(255,255,255,.012) 0 1px,transparent 1px 10px),
      radial-gradient(circle at 50% -10%,rgba(225,29,46,.08),transparent 32%),
      var(--bg);
  }

  .wrap{
    width:min(1880px,calc(100% - 28px));
    margin:0 auto;
    padding:26px 0 70px;
  }

  .brand{display:flex;justify-content:center;align-items:baseline;gap:10px;margin-bottom:24px}
  .brand .mark{font-family:var(--display);font-size:26px;letter-spacing:.07em;text-transform:uppercase}
  .brand .mark em{font-style:normal;color:var(--red2)}
  .brand .tag{font-family:var(--mono);font-size:9px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase}

  .scanner{
    max-width:860px;
    margin:0 auto;
    border:1px solid var(--line);
    background:linear-gradient(180deg,rgba(255,255,255,.025),transparent);
    position:relative;
  }
  .scanner:before,.scanner:after{
    content:"";position:absolute;width:18px;height:18px;border-color:var(--red);opacity:.85;pointer-events:none
  }
  .scanner:before{left:-1px;top:-1px;border-left:1px solid;border-top:1px solid}
  .scanner:after{right:-1px;bottom:-1px;border-right:1px solid;border-bottom:1px solid}
  .scan-inner{display:flex;align-items:center;gap:14px;padding:15px 18px}
  .scan-label{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--red2);text-transform:uppercase;white-space:nowrap}
  .scan-row{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
  .scan-row input{width:100%;background:transparent;border:0;outline:0;color:var(--text);font-family:var(--mono);font-size:13px}
  .scan-row input::placeholder{color:#52525a}
  .caret{width:7px;height:15px;background:var(--red2);animation:blink 1s step-end infinite}
  @keyframes blink{50%{opacity:0}}

  .tags{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:18px 0 16px}
  .chip{
    font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);background:#08080a;border:1px solid var(--line);padding:7px 11px;cursor:pointer;transition:.15s
  }
  .chip:hover,.chip.active{color:#fff;border-color:var(--red);background:rgba(225,29,46,.10)}

  .controls{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 20px}
  .controls label{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .controls input[type="range"]{-webkit-appearance:none;width:190px;height:2px;background:var(--line);outline:0}
  .controls input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--red2);border:2px solid #050506}
  .controls input[type="range"]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--red2);border:2px solid #050506}
  .controls .val{font-family:var(--mono);font-size:11px;color:var(--red2);min-width:18px;text-align:center}

  .grid{
    display:grid;
    grid-template-columns:repeat(var(--cols),minmax(0,1fr));
    gap:12px;
  }

  .card{
    position:relative;
    aspect-ratio:65/90;
    overflow:hidden;
    cursor:pointer;
    border:1px solid rgba(255,255,255,.11);
    background:#0b0b0d;
    isolation:isolate;
    transition:transform .17s ease,border-color .17s ease,box-shadow .17s ease;
  }
  .card:hover{
    transform:translateY(-3px);
    border-color:rgba(225,29,46,.72);
    box-shadow:0 10px 30px rgba(0,0,0,.28);
  }

  .photo{
    position:absolute;
    inset:0;
    width:100%;height:100%;
    object-fit:cover;
    object-position:center;
    z-index:0;
    filter:saturate(.92) contrast(1.03);
    transform:scale(1.002);
  }

  /* Name + code sit together at the BOTTOM-LEFT, directly on top of the card image. */
  .top-info{
    position:absolute;
    left:0;right:0;bottom:0;
    z-index:3;
    padding:28px 10px 10px;
    pointer-events:none;
    background:linear-gradient(180deg,rgba(3,3,4,0) 0%,rgba(3,3,4,.55) 42%,rgba(3,3,4,.92) 100%);
  }
  .name{
    margin:0;
    font-family:var(--display);
    font-size:clamp(13px,1.15vw,20px);
    line-height:.98;
    letter-spacing:.02em;
    text-transform:uppercase;
    text-shadow:0 2px 8px rgba(0,0,0,.9);
  }
  .code{
    position:static;
    margin-top:5px;
    font-family:var(--mono);
    font-size:clamp(8px,.62vw,11px);
    color:#d0d0d4;
    letter-spacing:.02em;
    text-align:left;
    text-shadow:0 2px 6px rgba(0,0,0,.95);
  }

  .bottom-fade{
    position:absolute;left:0;right:0;bottom:0;height:25%;z-index:1;pointer-events:none;
    background:linear-gradient(180deg,transparent,rgba(4,4,5,.72));
  }

  .card:before,.card:after{content:"";position:absolute;z-index:4;width:11px;height:11px;opacity:.75;pointer-events:none}
  .card:before{left:5px;top:5px;border-left:1px solid var(--red);border-top:1px solid var(--red)}
  .card:after{right:5px;bottom:5px;border-right:1px solid var(--red);border-bottom:1px solid var(--red)}

  .empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);font-family:var(--mono);font-size:11px}

  .modal{
    position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:28px;
    background:rgba(0,0,0,.82);backdrop-filter:blur(8px)
  }
  .modal.open{display:grid}
  .modal-card{position:relative;width:min(460px,88vw);max-height:90vh;aspect-ratio:65/90;border:1px solid rgba(225,29,46,.7);background:#08080a;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.65)}
  .modal-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .modal-card .top-info{padding:46px 16px 16px}
  .modal-card .name{font-size:30px}
  .modal-card .code{font-size:12px;margin-top:7px}
  .close{position:absolute;right:14px;top:12px;z-index:30;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.55);color:#fff;width:34px;height:34px;cursor:pointer;font:18px/1 var(--mono)}

  @media (max-width:1500px){:root{--cols:7}.grid{gap:11px}}
  @media (max-width:1280px){:root{--cols:6}}
  @media (max-width:1050px){:root{--cols:5}}
  @media (max-width:820px){
    .wrap{width:min(100% - 18px,1880px);padding-top:16px}
    :root{--cols:3}
    .grid{gap:8px}
    .scan-inner{align-items:flex-start;flex-direction:column;gap:7px}
    .controls{display:none}
    .brand{margin-bottom:16px}
  }
  @media (max-width:460px){
    :root{--cols:3}
    .name{font-size:12px}.code{font-size:7.5px}.top-info{padding:22px 7px 7px}
  }

.version-tag{font-family:var(--mono);font-size:8px;color:#5d5d65;letter-spacing:.12em}
.utility-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.utility,.db-mini{border:1px solid var(--line);background:#08080a;color:var(--muted);padding:7px 11px;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase}
.utility{cursor:pointer}.utility:hover,.utility.active{color:#fff;border-color:var(--red);background:rgba(225,29,46,.10)}
.db-mini{display:inline-flex;align-items:center;gap:7px}.db-dot{width:7px;height:7px;border-radius:50%;background:#777}.db-dot.ok{background:#22c55e}.db-dot.err{background:#ef4444}
.vault-mini{position:absolute;right:8px;top:8px;z-index:8;width:26px;height:26px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.58);color:#fff;font-family:var(--mono);cursor:pointer;opacity:0}
.card:hover .vault-mini,.card.in-vault .vault-mini{opacity:1}.card.in-vault .vault-mini{color:var(--red2);border-color:var(--red)}
.modal{z-index:20000}.modal-card{width:min(520px,90vw)}
.modal-actions{position:absolute;z-index:31;right:14px;bottom:14px}.vault-action{border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.72);color:#fff;padding:9px 12px;font-family:var(--mono);font-size:9px;text-transform:uppercase;cursor:pointer}.vault-action.active{color:var(--red2);border-color:var(--red)}
.toast{position:fixed;z-index:30000;left:50%;bottom:28px;transform:translate(-50%,10px);padding:10px 13px;border:1px solid var(--line);background:rgba(8,8,10,.95);color:#fff;font-family:var(--mono);font-size:10px;opacity:0;pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){body{overscroll-behavior-y:auto}.wrap{padding-bottom:90px}.utility-row{justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}.utility-row::-webkit-scrollbar{display:none}.utility,.db-mini{flex:none}.modal{padding:18px}}


/* v23 cleanup */
.scanner{max-width:320px!important}
.scan-inner{padding:11px 14px!important}
.scan-label{font-size:8px!important}
.scan-row input{font-size:11px!important}
.name{font-weight:400!important}
.vault-mini,.modal-actions,.vault-action{display:none!important}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
const AISIN_LOCAL =
  location.hostname === '127.0.0.1' ||
  location.hostname === 'localhost';

if(!AISIN_LOCAL){
  window.OneSignalDeferred=window.OneSignalDeferred||[];
  window.OneSignalDeferred.push(async function(OneSignal){
    try{
      await OneSignal.init({
        appId:"4b7237bb-c480-482c-b004-7649d0b939b0",
        serviceWorkerPath:"sw.js",
        serviceWorkerParam:{scope:"/"},
        notifyButton:{enable:false},
        autoResubscribe:true
      });
      window.AisinOneSignal=OneSignal;
      window.dispatchEvent(new Event("aisin-onesignal-ready"));
    }catch(e){
      console.error("OneSignal:",e);
    }
  });
}else{
  console.info("Aisin local mode: OneSignal disabled. Supabase remains enabled.");
}
</script>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <span class="mark">A<em>I</em>SIN</span>
    <span class="tag">Studio Dossier</span><span class="version-tag">v24</span>
  </div>

  <div class="scanner">
    <div class="scan-inner">
      <div class="scan-label">// search </div>
      <div class="scan-row">
        <input id="q" placeholder=" " autocomplete="off" />
        <div class="caret"></div>
      </div>
    </div>
  </div>

  <div class="tags" id="tagRow">
    <button class="chip active" data-v="all">All</button>
  </div>
  <div class="utility-row">
    <div class="db-mini"><span class="db-dot" id="dbDot"></span><span id="dbText">database connecting</span></div>
    <button class="utility" id="notifBtn">Enable notifications</button>
    <button class="utility" id="retryBtn">Update Collection</button>
  </div>

  <div class="controls">
    <label for="density">Cards per row</label>
    <input type="range" id="density" min="4" max="8" value="8" />
    <span class="val" id="densityVal">8</span>
  </div>

  <div class="grid" id="grid"></div>
</div>

<div class="modal" id="modal" aria-hidden="true">
  <div class="modal-card" id="modalCard">
    <button class="close" id="closeModal" aria-label="Close">×</button>
    <img id="modalImg" alt="" />
    <div class="top-info">
      <div class="name" id="modalName"></div>
      <div class="code" id="modalCode"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL='https://sfwoguzaaubbefkylgrl.supabase.co';
const SUPABASE_KEY='sb_publishable_uP72rwG4WNuC0aViiMyYzg_SU9QkVw6';
const BUCKET='cards';
const VAULT_KEY='aisin_my_vault_v1';

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let cards=[];
let tag='all';
let currentCard=null;

const grid=document.getElementById('grid');
const q=document.getElementById('q');
const density=document.getElementById('density');
const densityVal=document.getElementById('densityVal');
const modal=document.getElementById('modal');
const modalImgEl=document.getElementById('modalImg');
const modalNameEl=document.getElementById('modalName');
const modalCodeEl=document.getElementById('modalCode');
const closeModalBtn=document.getElementById('closeModal');
const dbDot=document.getElementById('dbDot');
const dbText=document.getElementById('dbText');
const notifBtn=document.getElementById('notifBtn');
const retryBtnEl=document.getElementById('retryBtn');

function esc(v){
  return String(v??'')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

function codeFor(c){
  return `V${c.volume}-${String(c.card_number).padStart(3,'0')}`;
}

function imageFor(c){
  if(!c.image_file) return '';
  const path=c.image_file.split('/').map(encodeURIComponent).join('/');
  return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path}`;
}

function getVault(){
  try{
    const data=JSON.parse(localStorage.getItem(VAULT_KEY)||'[]');
    return Array.isArray(data)?data:[];
  }catch(e){
    return [];
  }
}

function saveVault(items){
  localStorage.setItem(VAULT_KEY,JSON.stringify([...new Set(items)]));
}

function inVault(c){
  return getVault().includes(codeFor(c));
}

function toast(text){
  const el=document.getElementById('toast');
  if(!el) return;
  el.textContent=text;
  el.classList.add('show');
  clearTimeout(window.__aisinToast);
  window.__aisinToast=setTimeout(()=>el.classList.remove('show'),1500);
}

function toggleVault(c){
  let items=getVault();
  const code=codeFor(c);

  if(items.includes(code)){
    items=items.filter(x=>x!==code);
    toast('Removed from My Vault');
  }else{
    items.push(code);
    toast('Added to My Vault');
  }

  saveVault(items);
  render();
}

function rebuildVolumeFilters(){
  const row=document.getElementById('tagRow');
  const vols=[...new Set(cards.map(c=>Number(c.volume)).filter(Boolean))].sort((a,b)=>a-b);

  row.innerHTML=
    `<button class="chip ${tag==='all'?'active':''}" data-v="all">All</button>`+
    vols.map(v=>`<button class="chip ${tag===`v${v}`?'active':''}" data-v="v${v}">Vol.${String(v).padStart(2,'0')}</button>`).join('');
}

async function loadCards(){
  dbText.textContent='Updating collection…';
  dbDot.className='db-dot';

  try{
    const {data,error}=await db
      .from('cards')
      .select('character_name, volume, card_number, image_file')
      .order('volume',{ascending:true})
      .order('card_number',{ascending:true});

    if(error) throw error;

    cards=data||[];
    dbText.textContent=`Total ${cards.length} Cards`;
    dbDot.className='db-dot ok';

    rebuildVolumeFilters();
    render();
  }catch(err){
    console.error('Supabase error:',err);
    dbText.textContent='Collection error';
    dbDot.className='db-dot err';
    grid.innerHTML=`<div class="empty">DATABASE ERROR: ${esc(err.message||String(err)).toUpperCase()}</div>`;
  }
}

function render(){
  const term=q.value.trim().toLowerCase();
  

  const list=cards.filter(c=>{
    const code=codeFor(c);
    const matchesTag=
      tag==='all' ||
      tag===`v${c.volume}` ||
      false;

    const matchesSearch=
      !term ||
      (c.character_name||'').toLowerCase().includes(term) ||
      code.toLowerCase().includes(term);

    return matchesTag && matchesSearch;
  });

  if(!list.length){
    grid.innerHTML=`<div class="empty">${tag==='vault'?'MY VAULT IS EMPTY':'NO CARDS FOUND'}</div>`;
    return;
  }

  grid.innerHTML=list.map(c=>{
    const code=codeFor(c);
    const img=imageFor(c);

    return `
      <article class="card" data-code="${code}" tabindex="0">
        ${img?`<img class="photo" src="${esc(img)}" alt="${esc(c.character_name||'Card')}" loading="lazy">`:''}
        <div class="top-info">
          <div class="name">${esc(c.character_name||'Unnamed')}</div>
          <div class="code">${code}</div>
        </div>
        <div class="bottom-fade"></div>
      </article>
    `;
  }).join('');
}

function setCols(v){
  document.documentElement.style.setProperty('--cols',v);
  densityVal.textContent=v;
}

function findByCode(code){
  return cards.find(c=>codeFor(c)===code);
}

function openCard(c){
  currentCard=c;
  modalImgEl.src=imageFor(c);
  modalImgEl.alt=c.character_name||'Card';
  modalNameEl.textContent=c.character_name||'Unnamed';
  modalCodeEl.textContent=codeFor(c);
  modal.classList.add('open');
  modal.setAttribute('aria-hidden','false');
}


function closeCardModal(){
  modal.classList.remove('open');
  modal.setAttribute('aria-hidden','true');
  currentCard=null;
}

function isIOS(){
  return /iPhone|iPad|iPod/i.test(navigator.userAgent);
}

function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
}

async function refreshNotif(){
  if(typeof AISIN_LOCAL !== 'undefined' && AISIN_LOCAL){
    notifBtn.textContent='Notifications: production only';
    notifBtn.disabled=true;
    return;
  }

  if(!('Notification' in window)){
    notifBtn.textContent='Notifications unsupported';
    notifBtn.disabled=true;
    return;
  }

  if(isIOS()&&!isStandalone()){
    notifBtn.textContent='Install app for notifications';
    notifBtn.disabled=true;
    return;
  }

  if(Notification.permission==='granted'){
    notifBtn.textContent='Notifications enabled';
    notifBtn.classList.add('active');
    return;
  }

  if(Notification.permission==='denied'){
    notifBtn.textContent='Notifications blocked';
    notifBtn.disabled=true;
    return;
  }

  notifBtn.textContent='Enable notifications';
  notifBtn.disabled=false;
}

async function enableNotifications(){
  if(!window.AisinOneSignal){
    toast('OneSignal is still loading');
    return;
  }

  try{
    await window.AisinOneSignal.Notifications.requestPermission();
    if(window.AisinOneSignal.Notifications.permission){
      try{await window.AisinOneSignal.User.PushSubscription.optIn()}catch(e){}
      toast('Notifications enabled');
    }
    refreshNotif();
  }catch(e){
    console.error(e);
    toast('Could not enable notifications');
  }
}

q.addEventListener('input',render);
density.addEventListener('input',e=>setCols(e.target.value));

document.getElementById('tagRow').addEventListener('click',e=>{
  const b=e.target.closest('.chip');
  if(!b) return;
  tag=b.dataset.v;
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  render();
});

grid.addEventListener('click',e=>{
  const vaultButton=e.target.closest('.vault-mini');

  if(vaultButton){
    e.stopPropagation();
    const c=findByCode(vaultButton.dataset.vaultCode);
    if(c) toggleVault(c);
    return;
  }

  const cardEl=e.target.closest('.card');
  if(!cardEl) return;

  const c=findByCode(cardEl.dataset.code);
  if(c) openCard(c);
});

grid.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ') return;
  const cardEl=e.target.closest('.card');
  if(!cardEl) return;
  e.preventDefault();

  const c=findByCode(cardEl.dataset.code);
  if(c) openCard(c);
});

closeModalBtn.addEventListener('click',closeCardModal);
modal.addEventListener('click',e=>{
  if(e.target===modal) closeCardModal();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeCardModal();
});

retryBtnEl.addEventListener('click',loadCards);
notifBtn.addEventListener('click',enableNotifications);
window.addEventListener('aisin-onesignal-ready',refreshNotif);

setCols(window.innerWidth<=820?3:8);
refreshNotif();
loadCards();
</script>
</body>
</html>
